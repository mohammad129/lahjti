services:
  - type: web
    name: lahjti-backend
    env: node
    # Public-pilot tier: the service can cold-start after inactivity.
    plan: free
    # TypeScript needs @types packages from devDependencies at build time.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_FAST_MODEL
        value: gpt-4o-mini
      - key: AI_ADVANCED_MODEL
        value: gpt-4o-mini
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: DATABASE_URL
        fromDatabase:
          name: lahjti-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID_ABBAS
        sync: false
      - key: ELEVENLABS_VOICE_ID_DUNYA
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER_IDS
        sync: false

databases:
  - name: lahjti-postgres
    # Render Free Postgres is suitable only for this 30-day public pilot.
    plan: free
    databaseName: lahjti
    user: lahjti_user
