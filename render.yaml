services:
  - type: web
    name: lahjti-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: smart/premium
      - key: AI_FAST_MODEL
        value: smart/premium
      - key: AI_ADVANCED_MODEL
        value: smart/premium
      - key: OPENAI_BASE_URL
        value: https://api.netmind.ai/inference-api/openai/v1
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: DATABASE_URL
        fromDatabase:
          name: lahjti-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: lahjti-postgres
    plan: starter
    databaseName: lahjti
    user: lahjti_user
